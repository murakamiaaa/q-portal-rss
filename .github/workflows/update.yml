name: 5min-Q-Portal-Update

on:
  schedule:
    - cron: '*/5 * * * *' # 5分おきに実行
  workflow_dispatch: # 手動実行ボタン用

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 書き込み権限を明示

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests feedgen beautifulsoup4 lxml

      - name: Run script
        run: python q-portal-rss.py

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          git add feed.xml
          git commit -m "Update feed.xml with full text" || echo "No changes to commit"
          git push